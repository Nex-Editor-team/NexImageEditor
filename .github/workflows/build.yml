name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libopencv-dev qt6-image-formats-plugins
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test (offscreen)
        run: |
          python3 - <<'PYTEST'
          import pathlib, subprocess, sys
          result = subprocess.run(["ctest", "--test-dir", "build", "--output-on-failure"],
                                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout)
          pathlib.Path("build/ctest-output.log").write_text(result.stdout)
          if result.returncode:
              # Expose the failing assertions in check annotations as well as raw logs.
              tail = result.stdout[-12000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=CTest failures::{tail}")
          sys.exit(result.returncode)
          PYTEST
