name: Build C++ app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Build .deb and tarball (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6, OpenCV and Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake debhelper dpkg-dev fakeroot \
            qt6-base-dev qt6-image-formats-plugins libopencv-dev

      - name: Build Debian package
        run: |
          # dpkg-buildpackage writes the .deb one level above the source tree.
          dpkg-buildpackage -us -uc -b -j"$(nproc)"

      - name: Build portable tarball
        run: |
          cmake -S . -B build-tar -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tar --parallel
          cmake --install build-tar --prefix "$PWD/staging/usr"
          mkdir -p dist
          tar -C staging -czf dist/NexImageEditor-linux-x86_64.tar.gz usr

      - name: Collect artifacts
        run: |
          mkdir -p dist
          mv ../neximageeditor_*.deb dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: NexImageEditor-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NexImageEditor-linux
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" \
            --generate-notes || gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
